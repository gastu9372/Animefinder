services:
  redis:
    image: redis:7-alpine
    container_name: animefinder-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - animefinder-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: animefinder-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - TRUSTED_PROXIES=127.0.0.1,172.16.0.0/12,10.0.0.0/8
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "8000:8000"
    networks:
      - animefinder-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: animefinder-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 3s
    networks:
      - animefinder-net

networks:
  animefinder-net:
    driver: bridge
